name: Bug report
description: Report a reproducible problem in PresetLauncher.
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include passwords, private paths or sensitive preset data. Report vulnerabilities using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PresetLauncher version
      placeholder: e.g. 1.2.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run winver to find this information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the relevant preset settings, with private information removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
