name: Bug report
description: Report a reproducible problem in PresetLauncher.
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include passwords, personal paths, or full data files. For security issues, follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PresetLauncher version
      description: See Settings > About. For a source build, provide the commit if known.
      placeholder: e.g. 1.2.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run winver; include CPU architecture if known.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release installer
        - In-app update
        - Local source build
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Creating or editing presets
        - Adding files or running processes
        - Launch All
        - Launch Missing Only
        - Closing processes
        - JSON import or local data
        - History or statistics
        - Settings or appearance
        - Installation or updates
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For launch issues, include file type, whether the program was already running, delay and administrator setting. Use anonymized examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error messages or screenshots
      description: Remove private paths and other personal information.
