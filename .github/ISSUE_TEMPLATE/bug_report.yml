name: Signaler un bug
description: Signaler un bug ou un comportement inattendu
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug. Veuillez remplir les informations ci-dessous.

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Decrivez clairement le probleme rencontre.
      placeholder: Decrivez ce qui se passe...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Etapes pour reproduire
      description: Listez les etapes pour reproduire le bug.
      placeholder: |
        1. Ouvrir l'application
        2. Cliquer sur ...
        3. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Decrivez ce que vous attendiez.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'ecran
      description: Ajoutez des captures d'ecran si applicable.
    validations:
      required: false

  - type: dropdown
    id: version
    attributes:
      label: Version de l'application
      options:
        - 1.2.6 (derniere)
        - 1.2.5
        - 1.2.4
        - 1.2.3
        - 1.2.2
        - 1.2.1
        - 1.2.0
        - 1.0.0
        - Autre
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Systeme d'exploitation
      options:
        - Windows 11
        - Windows 10
        - Windows Server 2022
        - Windows Server 2019
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Journaux d'erreur
      description: Si disponible, collez les journaux d'erreur.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Informations complementaires
      description: Ajoutez tout autre contexte sur le probleme.
    validations:
      required: false
