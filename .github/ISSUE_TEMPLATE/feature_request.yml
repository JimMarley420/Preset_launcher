name: Feature request
description: Suggest a change to how PresetLauncher works.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Preset management
        - Launching or closing programs
        - History or statistics
        - Data import or backup
        - Settings or appearance
        - Installation or updates
        - Other
