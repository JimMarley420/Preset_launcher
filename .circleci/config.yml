version: 2.1
setup: true

jobs:
  select-validation:
    docker:
      - image: cimg/python:3.13.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Select validation lane and continue pipeline
          command: python .circleci/ci_scope.py continue

workflows:
  setup:
    when:
      not:
        equal: [gh-pages, << pipeline.git.branch >>]
    jobs:
      - select-validation
